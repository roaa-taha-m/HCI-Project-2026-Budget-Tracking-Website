<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="logo">T</span> Tally</div>

    <nav class="side-nav" aria-label="Main">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/budgets" routerLinkActive="active">Budgets</a>
      <a routerLink="/expenses" routerLinkActive="active">Expenses</a>
      <a routerLink="/income" routerLinkActive="active">Income</a>
      <a routerLink="/goals" routerLinkActive="active">Goals</a>
      <a routerLink="/reports" routerLinkActive="active">Reports</a>
    </nav>

    <div class="user" *ngIf="user$ | async as user">
        <span class="avatar">
          {{ user.displayName?.charAt(0) || 'U' }}
        </span>
      <div>
        <strong>{{ user.displayName || user.email }}</strong><br />
        <a href="#" (click)="logout(); $event.preventDefault()">Log out</a>
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
